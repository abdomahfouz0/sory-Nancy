<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>صباح الخير يا نانسي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            --morning-bg: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%);
            --night-bg: linear-gradient(135deg, #141e30 0%, #243b55 100%);
            --text-dark: #4a2511;
            --text-light: #fff;
            --primary: #ff4b6e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--morning-bg);
            font-family: 'Cairo', sans-serif;
            color: var(--text-dark);
            overflow-x: hidden;
            transition: background 1s ease;
        }

        /* شاشة شروق الشمس */
        #welcome-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; transition: opacity 1s, visibility 1s;
        }
        .sun-btn { font-size: 80px; color: #ffeb3b; cursor: pointer; filter: drop-shadow(0 0 20px #ffc107); animation: pulse 2s infinite; margin-bottom: 20px; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        /* المحتوى الرئيسي */
        #main-content { display: none; padding: 20px; max-width: 600px; margin: 0 auto; padding-bottom: 100px; }

        /* شريط الكلمات */
        .marquee-container { width: 100vw; background: rgba(255,255,255,0.3); padding: 10px 0; position: absolute; top: 0; left: 0; overflow: hidden; white-space: nowrap; }
        .marquee { display: inline-block; animation: scroll 15s linear infinite; font-weight: bold; color: var(--primary); }
        @keyframes scroll { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }

        /* الكروت المشتركة */
        .card { background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px); border-radius: 20px; padding: 25px; margin-top: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; border: 2px solid rgba(255,255,255,0.8); }

        #typewriter-text { font-size: 22px; min-height: 80px; color: var(--text-dark); font-weight: 700; line-height: 1.5; }

        .promise-box { background: linear-gradient(135deg, #fff 0%, #f9f9f9 100%); border-right: 8px solid var(--primary); font-family: 'Aref Ruqaa', serif; font-size: 26px; line-height: 1.8; color: #333; padding: 30px 20px; position: relative; }
        .promise-box i { position: absolute; color: rgba(255, 75, 110, 0.1); font-size: 80px; top: 10px; left: 10px; }

        input[type=range] { width: 100%; accent-color: var(--primary); margin: 15px 0; }
        #slider-result { font-size: 24px; font-weight: bold; color: var(--primary); }

        .bubbles-container { display: flex; justify-content: space-around; margin-top: 20px; }
        .bubble { width: 80px; height: 80px; background: rgba(255,255,255,0.8); border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 30px; box-shadow: inset 0 0 20px rgba(255,75,110,0.2); transition: 0.3s; }
        .bubble.popped { background: var(--primary); color: white; font-size: 16px; font-weight: bold; width: 100px; height: 100px; padding: 10px; }

        .envelope { font-size: 80px; color: #d4af37; cursor: pointer; transition: 0.5s; }
        #secret-paper { display: none; margin-top: 15px; font-size: 20px; font-weight: bold; color: var(--primary); }

        .night-btn { background: #2c3e50; color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; margin-top: 20px; width: 100%; }

        .mood-btn { background: var(--primary); color: white; border: none; padding: 8px 15px; border-radius: 15px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; margin: 5px; transition: 0.3s; }
        .mood-btn:hover { background: var(--text-dark); }

        .ticket { background: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%); border: 2px dashed #ccc; padding: 20px; border-radius: 10px; color: #333; text-align: right; position: relative; }
        .ticket::before { content: '✈️'; font-size: 40px; position: absolute; left: 20px; top: 20px; opacity: 0.2; }

        .blur-box { background: #ff9a9e; color: transparent; text-shadow: 0 0 20px rgba(255,255,255,1); padding: 30px; border-radius: 15px; cursor: pointer; transition: 1s; font-size: 22px; font-weight: bold; }
        .clear-blur { background: transparent; color: var(--primary); text-shadow: none; border: 2px solid var(--primary); }

        /* 16. البطارية */
        .battery-container { width: 100px; height: 50px; border: 4px solid var(--text-dark); border-radius: 10px; position: relative; margin: 20px auto; padding: 2px; }
        .battery-container::after { content: ''; position: absolute; right: -10px; top: 10px; width: 6px; height: 20px; background: var(--text-dark); border-radius: 0 5px 5px 0; }
        .battery-level { width: 10%; height: 100%; background: #e74c3c; transition: all 1.5s ease; border-radius: 5px; }

        /* 17. محطة الذكريات */
        .timeline { border-right: 4px solid var(--primary); padding-right: 20px; text-align: right; margin-top: 20px; }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item::before { content: '❤️'; position: absolute; right: -33px; top: 0; background: white; border-radius: 50%; font-size: 14px; padding: 2px; border: 2px solid var(--primary); }

        /* 18. كشف الكذب */
        .lie-container { position: relative; height: 100px; margin-top: 20px; }
        .lie-btn { position: absolute; padding: 10px 20px; border-radius: 15px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        #btn-yes { background: var(--primary); color: white; right: 20%; top: 20px; }
        #btn-no { background: #ccc; color: #333; left: 20%; top: 20px; }

        /* 10. زرار الانفجار (الواتساب) */
        .finale-btn { background: var(--primary); color: white; border: none; padding: 15px 40px; font-size: 22px; border-radius: 50px; cursor: pointer; font-family: 'Cairo'; font-weight: bold; width: 100%; margin-top: 40px; box-shadow: 0 10px 20px rgba(255, 75, 110, 0.4); animation: pulse 2s infinite; }

        .floating-heart { position: fixed; pointer-events: none; z-index: 9999; animation: floatUp 3s ease-in forwards; }
        @keyframes floatUp { 0% { transform: translateY(100vh) scale(0.5); opacity: 1; } 100% { transform: translateY(-20vh) scale(1.5) rotate(360deg); opacity: 0; } }
