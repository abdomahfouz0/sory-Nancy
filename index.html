<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفاجأة عيد الأضحى</title>
  <style>
    /* الإعدادات الأساسية لتهيئة الصفحة */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0b12; /* خلفية داكنة فخمة */
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* حاوية العرض الأساسية في الصفحة */
    .welcome-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
      padding: 20px;
      position: relative;
      z-index: 2;
      text-align: center;
    }

    /* نص التهنئة الخاص بعيد الأضحى لنانسي */
    .eid-greeting {
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #d4af37, #f3e5ab, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
      animation: fadeInGlow 3s ease-in-out infinite alternate;
    }

    @keyframes fadeInGlow {
      0% { text-shadow: 0 4px 15px rgba(212, 175, 55, 0.2); }
      100% { text-shadow: 0 4px 25px rgba(212, 175, 55, 0.6); }
    }

    /* تصميم الزرار المبهر النابض */
    .premium-btn {
      background: linear-gradient(135deg, #1a1a2e, #0f0f1a);
      color: #ffffff;
      border: 2px solid #d4af37;
      padding: 18px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      position: relative;
      outline: none;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
      letter-spacing: 0.5px;
    }

    .premium-btn:hover {
      transform: translateY(-5px);
      background: linear-gradient(135deg, #d4af37, #aa841e);
      color: #0b0b12;
      box-shadow: 0 12px 30px rgba(212, 175, 55, 0.4);
    }

    .premium-btn::after {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border-radius: 50px;
      border: 2px solid #d4af37;
      opacity: 0;
      animation: pulseGlow 2s infinite;
      z-index: -1;
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); opacity: 0.6; }
      50% { transform: scale(1.12); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    /* قاعة السينما وتعتيم الأنوار */
    .cinema-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(3, 3, 5, 0.96);
      backdrop-filter: blur(12px);
      z-index: 99999;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
    }

    .cinema-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.9);
      width: 92%;
      max-width: 850px;
      transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cinema-overlay.active .cinema-container {
      transform: translate(-50%, -50%) scale(1);
    }

    /* زرار إغلاق الشاشة */
    .close-btn {
      position: absolute;
      top: -45px;
      left: 5px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e0e0e0;
      padding: 6px 16px;
      font-size: 14px;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .close-btn:hover {
      background: #e63946;
      color: #fff;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(230, 57, 70, 0.4);
    }

    /* الإطار الذهبي المشع حول الفيديو */
    .video-wrapper {
      position: relative;
      padding-bottom: 56.25%;
      height: 0;
      box-shadow: 0 15px 50px rgba(212, 175, 55, 0.15), 0 25px 80px rgba(0,0,0,0.9);
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #d4af37;
    }
    .video-wrapper iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    /* خلفية تأثير رموز العيد المتطايرة */
    .particles-bg {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="particles-bg" id="particlesBg"></div>

  <div class="welcome-container">
    <div class="eid-greeting">كل عيد أضحى وأنتي معايا يا نانسي ✨</div>
    <button id="openCinemaBtn" class="premium-btn">
      🎬 اضغطي هنا لمشاهدة عيدية السينما
    </button>
  </div>

  <div id="cinemaOverlay" class="cinema-overlay">
    <div class="cinema-container">
      <button id="closeCinemaBtn" class="close-btn">✕ إغلاق الشاشة</button>
      <div class="video-wrapper">
        <iframe id="cinemaVideo" src="https://drive.google.com/file/d/1sG9P_Q-AVSCd7jsyYttfDG1bsdRTRpxn/preview" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    const openBtn = document.getElementById('openCinemaBtn');
    const closeBtn = document.getElementById('closeCinemaBtn');
    const overlay = document.getElementById('cinemaOverlay');
    const video = document.getElementById('cinemaVideo');

    // تأثير فتح السينما
    openBtn.addEventListener('click', () => {
      overlay.style.display = 'block';
      setTimeout(() => {
        overlay.style.opacity = '1';
        overlay.classList.add('active');
      }, 20);
    });

    // تأثير إغلاق السينما وإيقاف الصوت
    closeBtn.addEventListener('click', () => {
      overlay.style.opacity = '0';
      overlay.classList.remove('active');
      setTimeout(() => {
        overlay.style.display = 'none';
        
        // إعادة إنعاش الـ iframe لإيقاف الفيديو تماماً
        const currentSrc = video.src;
        video.src = '';
        video.src = currentSrc;
      }, 500);
    });

    // سكريبت لتوليد تأثير أجواء العيد في الخلفية
    function createEidParticles() {
      const bg = document.getElementById('particlesBg');
      const particleCount = 25; // عدد الأشكال اللي بتطير
      const eidEmojis = ['🐑', '🎈', '✨', '🌙', '🎉']; // رموز العيد
      
      for(let i = 0; i < particleCount; i++) {
        const particle = document.createElement('div');
        particle.innerText = eidEmojis[Math.floor(Math.random() * eidEmojis.length)];
        particle.style.position = 'absolute';
        particle.style.fontSize = Math.random() * 15 + 15 + 'px'; // أحجام مختلفة
        particle.style.opacity = Math.random() * 0.6 + 0.2;
        particle.style.top = Math.random() * 100 + 'vh';
        particle.style.left = Math.random() * 100 + 'vw';
        
        // حركة الطيران والدوران
        particle.animate([
          { transform: 'translateY(0) rotate(0deg)', opacity: particle.style.opacity },
          { transform: `translateY(-${Math.random() * 200 + 100}px) rotate(${Math.random() * 360}deg)`, opacity: 0 }
        ], {
          duration: Math.random() * 5000 + 4000,
          iterations: Infinity,
          easing: 'ease-in-out'
        });
        
        bg.appendChild(particle);
      }
    }
    
    // تشغيل التأثير فور تحميل الصفحة
    window.addEventListener('DOMContentLoaded', createEidParticles);
  </script>
</body>
</html>
