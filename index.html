<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مملكة السعادة الخاصة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #5d4037;
            --accent-color: #d81b60;
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.4);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0; padding: 0; font-family: 'Cairo', sans-serif;
            height: 100vh; display: flex; justify-content: center; align-items: center;
            overflow: hidden; cursor: crosshair;
            background: linear-gradient(-45deg, #fdfcfb, #e2d1c3, #f5f7fa, #c3cfe2);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* شاشة القفل */
        #lock-screen {
            position: fixed; inset: 0; background: var(--primary-color);
            color: #fff; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 9999;
            transition: opacity 1s;
        }

        .fingerprint-icon {
            font-size: 80px; cursor: pointer; user-select: none;
            transition: transform 0.2s; filter: drop-shadow(0 0 10px rgba(216, 27, 96, 0.5));
        }
        .fingerprint-icon:active { transform: scale(0.9); }

        #progress-container {
            width: 200px; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 10px; margin-top: 25px; overflow: hidden;
        }
        #progress-bar { width: 0%; height: 100%; background: var(--accent-color); transition: width 0.1s linear; }

        /* الحاوية الرئيسية */
        .main-container {
            position: relative; z-index: 10; width: 90%; max-width: 500px;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 30px;
            padding: 30px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .timer-section {
            background: rgba(255,255,255,0.4); padding: 15px; border-radius: 20px;
            margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.5);
        }

        #timer { font-weight: bold; color: var(--primary-color); font-size: 1.1rem; margin-top: 5px; }

        h1 { color: var(--primary-color); font-size: 1.8rem; margin: 0 0 10px 0; }

        .happiness-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .card {
            background: #fff; border: none; padding: 15px; border-radius: 15px;
            color: var(--primary-color); font-weight: bold; font-size: 1.1rem;
            cursor: pointer; transition: 0.3s; box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        .card:hover { transform: translateY(-5px) rotate(2deg); background: var(--accent-color); color: #fff; }

        #secret-message {
            margin-top: 25px; min-height: 40px; color: var(--accent-color);
            font-weight: bold; font-size: 1.2rem; opacity: 0; transition: opacity 0.5s;
        }

        .btn-random {
            margin-top: 20px; background: var(--primary-color); color: white;
            border: none; padding: 10px 25px; border-radius: 50px;
            cursor: pointer; font-size: 1rem; transition: 0.3s;
        }
        .btn-random:hover { background: #3e2723; transform: scale(1.05); }

        /* تأثيرات بصرية */
        .heart { position: fixed; pointer-events: none; z-index: 100; animation: floatUp 2s ease-out forwards; }
        @keyframes floatUp { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-200px) scale(1.5); opacity: 0; } }

        .star { position: absolute; background: white; border-radius: 50%; opacity: 0.5; animation: twinkle 3s infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        .sparkle {
            position: absolute; width: 6px; height: 6px; background: #fff;
            border-radius: 50%; pointer-events: none; z-index: 999;
            box-shadow: 0 0 10px #d81b60; animation: sparkleFade 0.8s linear forwards;
        }
        @keyframes sparkleFade { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(0.2); } }
    </style>
</head>
<body>

<!-- مشغل يوتيوب المخفي لأغنية نانسي -->
<iframe id="youtube-audio" src="https://www.youtube.com/embed/9hzFk2Yp1y4?enablejsapi=1&autoplay=0&loop=1&playlist=9hzFk2Yp1y4" allow="autoplay" style="display:none;"></iframe>

<!-- شاشة القفل -->
<div id="lock-screen">
    <div class="fingerprint-icon" 
         onmousedown="startHold()" onmouseup="endHold()" 
         ontouchstart="startHold()" ontouchend="endHold()">☝️</div>
    <p style="margin-top: 15px; letter-spacing: 1px;">اضغطي مطولاً للدخول</p>
    <div id="progress-container"><div id="progress-bar"></div></div>
</div>

<!-- المحتوى الرئيسي -->
<div class="main-container">
    <h1>أنواع السعادة..</h1>
    
    <div class="timer-section">
        <span style="font-size: 0.85rem; color: #777;">وقتنا سوا منذ 21 نوفمبر 2024:</span>
        <div id="timer">تحميل العداد...</div>
    </div>

    <div class="happiness-grid">
        <button class="card" onclick="reveal('أنتي الأصل والباقي تفاصيل 👑', event)">١. أنتي</button>
        <button class="card" onclick="reveal('شمس بتنور قلبي حرفياً ☀️', event)">٢. ضحكتك</button>
        <button class="card" onclick="reveal('بحر غريق مش عاوز أطلع منه 🌊', event)">٣. عيونك</button>
        <button class="card" onclick="reveal('المزيكا اللي بترد الروح 🎵', event)">٤. صوتك</button>
        <button class="card" onclick="reveal('أحلى جنون بيخلي اليوم جنة 🤪', event)">٥. جنونك</button>
        <button class="card" onclick="reveal('أماني وطمأنينة قلبي 🕊️', event)">٦. رقتك</button>
    </div>

    <div id="secret-message"></div>

    <button class="btn-random" onclick="getRandomQuote()">💌 رسالة ليكي</button>
</div>

<!-- نجوم الخلفية -->
<div id="stars-container"></div>

<script>
    // 1. إعداد نجوم الخلفية
    const starsContainer = document.getElementById('stars-container');
    for (let i = 0; i < 50; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 'px';
        star.style.width = size; star.style.height = size;
        star.style.left = Math.random() * 100 + '%'; star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        starsContainer.appendChild(star);
    }

    // 2. تأثير الماوس السحري (البريق)
    document.addEventListener('mousemove', function(e) {
        const sparkle = document.createElement('div');
        sparkle.className = 'sparkle';
        sparkle.style.left = e.pageX + 'px';
        sparkle.style.top = e.pageY + 'px';
        document.body.appendChild(sparkle);
        setTimeout(() => sparkle.remove(), 800);
    });

    // 3. عداد الوقت (من 21 نوفمبر 2024)
    const startDate = new Date("2024-11-21T00:00:00");
    function updateTimer() {
        const diff = new Date() - startDate;
        const days = Math.floor(diff / 86400000);
        const hours = Math.floor((diff / 3600000) % 24);
        const mins = Math.floor((diff / 60000) % 60);
        const secs = Math.floor((diff / 1000) % 60);
        document.getElementById('timer').innerHTML = `${days} يوم و ${hours} ساعة و ${mins} دقيقة و ${secs} ثانية`;
    }
    setInterval(updateTimer, 1000);

    // 4. منطق شاشة القفل + تشغيل الأغنية من يوتيوب
    let holdTimer, progress = 0;
    
    function startHold() {
        holdTimer = setInterval(() => {
            progress += 2;
            document.getElementById('progress-bar').style.width = progress + '%';
            if (progress >= 100) {
                clearInterval(holdTimer);
                document.getElementById('lock-screen').style.opacity = '0';
                setTimeout(() => document.getElementById('lock-screen').style.display = 'none', 1000);
                
                // تشغيل الأغنية
                const ytPlayer = document.getElementById('youtube-audio');
                if (ytPlayer && ytPlayer.contentWindow) {
                    ytPlayer.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
                }
            }
        }, 20);
    }
    function endHold() {
        clearInterval(holdTimer);
        if (progress < 100) { progress = 0; document.getElementById('progress-bar').style.width = '0%'; }
    }

    // 5. إظهار الرسائل وتأثير القلوب
    function reveal(text, event) {
        const msg = document.getElementById('secret-message');
        msg.innerText = text; msg.style.opacity = '1';

        for (let i = 0; i < 8; i++) {
            const heart = document.createElement('div');
            heart.className = 'heart'; heart.innerHTML = '❤️';
            let x = event.clientX || (event.touches ? event.touches[0].clientX : window.innerWidth/2);
            let y = event.clientY || (event.touches ? event.touches[0].clientY : window.innerHeight/2);
            heart.style.left = x + (Math.random() * 50 - 25) + 'px';
            heart.style.top = y + 'px';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 2000);
        }
    }

    // 6. رسائل عشوائية
    const quotes = [
        "كل يوم بيمر وأنتي معايا هو عيد.",
        "ضحكتك هي السبب اللي بيخليني أحب الحياة.",
        "أنتي مش بس في بالي، أنتي بالي كله.",
        "ممتن جداً لليوم اللي جمعني بيكي (21 نوفمبر).",
        "لو سألوني عن السعادة، هقول اسمك."
    ];
    function getRandomQuote() {
        const quote = quotes[Math.floor(Math.random() * quotes.length)];
        reveal(quote, { clientX: window.innerWidth / 2, clientY: window.innerHeight / 2 });
    }
</script>

</body>
</html>
